
name: Create permanent Android signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate signing key
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate permanent key
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          EXISTING_KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing passwords."
            exit 1
          fi

          if [ -n "$EXISTING_KEY" ]; then
            echo "A signing key already exists. Refusing to generate another."
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore release-key.jks \
            -storetype JKS \
            -alias music-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Music App, OU=Android, O=Personal Project, L=Mexico City, ST=CDMX, C=MX"

          base64 -w 0 release-key.jks > signing-key-base64.txt

          rm release-key.jks

          test -s signing-key-base64.txt

      - name: Upload encoded signing key
        uses: actions/upload-artifact@v4
        with:
          name: music-signing-key-base64
          path: signing-key-base64.txt
          retention-days: 1
          if-no-files-found: error
